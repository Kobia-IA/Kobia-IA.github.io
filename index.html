<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thư viện Icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Nút chuyển đổi Dark/Light Mode -->
        <button id="theme-toggle" class="theme-btn" title="Đổi giao diện">
            <i class="fa-solid fa-moon"></i>
        </button>

        <!-- Phần Thông tin cá nhân & Avatar -->
        <header class="profile">
            <img src="avatar.jpg" alt="Avatar" class="avatar" onerror="this.src='https://via.placeholder.com/120'">
            <h1 class="name">Hữu Khánh(Kobia)</h1>
            <p class="role">Cybersecurity Student & Developer</p>
            <p class="bio">Luôn hướng tới các giải pháp tối giản và hiệu quả.<br>Khác biệt để dẫn đầu.</p>
        </header>

        <!-- Phần Kỹ năng / Tags nhanh -->
        <div class="tags">
            <span>#Cybersecurity</span>
            <span>#Linux</span>
            <span>#JavaSpring</span>
            <span>#Networking</span>
        </div>

        <!-- Phần Đường link mạng xã hội & Dự án -->
        <main class="links">
            <a href="https://github.com/Kobia-IA?tab=repositories" target="_blank" class="link-card">
                <i class="fa-brands fa-github"></i>
                <span>GitHub & Mã nguồn dự án</span>
                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>
            <a href="https://www.tiktok.com/@huukh0309" target="_blank" class="link-card">
                <i class="fa-brands fa-tiktok"></i>
                <span>Hồ Sơ TikTok</span>
                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>
            <a href="https://www.facebook.com/huu.khanh.283481/" target="_blank" class="link-card">
                <i class="fa-brands fa-facebook"></i>
                <span>Hồ Sơ Facebook</span>
                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>
            <button onclick="copyEmail('huukhanh030907@gmail.com')" class="link-card copy-btn">
                <i class="fa-solid fa-envelope"></i>
                <span id="email-text">Liên hệ qua Email (Nhấn để sao chép)</span>
                <i class="fa-regular fa-copy arrow"></i>
            </button>
        </main>

        <footer>
            <p>© 2026. Designed by HuuKhanh</p>
        </footer>
    </div>

    <!-- Script xử lý chức năng thực dụng -->
    <script>
        // Chức năng Dark/Light Mode
        const toggleBtn = document.getElementById('theme-toggle');
        const icon = toggleBtn.querySelector('i');
        
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        });

        // Chức năng Copy Email nhanh
        function copyEmail(email) {
            navigator.clipboard.writeText(email);
            const emailText = document.getElementById('email-text');
            const originalText = emailText.innerText;
            emailText.innerText = 'Đã sao chép: ' + email;
            setTimeout(() => {
                emailText.innerText = originalText;
            }, 2000);
        }
    </script>
</body>
</html>
